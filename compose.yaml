version: "3.8"

services:
  payment-service:
    build:
      context: .
      dockerfile: Dockerfile
    hostname: payment-service
    ports:
      - "${BACKEND_PORT:-3006}:3000"
    env_file:
      - ./.env
    environment:
      KAFKA_BROKER: ${KAFKA_BROKER:-kafka:29092}
    networks:
      - app-network
    command: npm run start:prod
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
